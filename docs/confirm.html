<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Makker - Confirmation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: -apple-system, sans-serif;
      background: #F4F3FF;
      color: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    h1 { color: #5B52F0; }
    a.button {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 28px;
      background: #5B52F0;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Compte confirmé ✅</h1>
  <p>Redirection vers Makker...</p>
  <a class="button" id="openApp" href="makker://login">Ouvrir l'application</a>

  <script>
    // Récupère les paramètres (access_token, etc.) transmis par Supabase
    const hash = window.location.hash;
    const appLink = 'makker://login' + hash;
    document.getElementById('openApp').href = appLink;

    // Tentative d'ouverture automatique
    window.location.href = appLink;
  </script>
</body>
</html>
